<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Emmanuel Kibet Korir</title>
    <style>
        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #111827;
            --text-primary: #e5e7eb;
            --text-secondary: #a0aec0;
            --accent-cyan: #00d9ff;
            --accent-emerald: #10b981;
            --accent-orange: #f97316;
            --card-bg: #111827;
            --border-radius: 8px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
        }

        h1, h2, h3 {
            font-family: Georgia, "Times New Roman", serif;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 16px;
            color: var(--accent-cyan);
        }

        h2 {
            font-size: 1.8em;
            margin: 32px 0 16px 0;
            color: var(--accent-cyan);
        }

        h3 {
            font-size: 1.3em;
            margin: 16px 0 8px 0;
        }

        header {
            background: var(--bg-secondary);
            border-bottom: 1px solid rgba(0, 217, 255, 0.1);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            gap: 32px;
            justify-content: center;
        }

        nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: var(--transition);
        }

        nav a:hover {
            color: var(--accent-cyan);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .hero {
            text-align: center;
            padding: 80px 20px;
            background: linear-gradient(135deg, rgba(0, 217, 255, 0.05), rgba(0, 217, 255, 0.02));
        }

        .hero-subtitle {
            color: var(--text-secondary);
            font-size: 1.1em;
            margin-top: 12px;
        }

        .blog-section {
            padding: 60px 20px;
        }

        .filter-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 32px 0;
            justify-content: center;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 1px solid var(--accent-cyan);
            background: transparent;
            color: var(--accent-cyan);
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: var(--transition);
            font-family: inherit;
            text-transform: capitalize;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: var(--accent-cyan);
            color: var(--bg-primary);
        }

        .posts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 28px;
            margin: 40px 0;
        }

        .post-card {
            background: var(--card-bg);
            border: 1px solid rgba(0, 217, 255, 0.1);
            border-radius: var(--border-radius);
            overflow: hidden;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
        }

        .post-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent-cyan);
            box-shadow: 0 16px 40px rgba(0, 217, 255, 0.15);
        }

        .post-header {
            height: 3px;
            background: linear-gradient(90deg, var(--accent-cyan), rgba(0, 217, 255, 0.4));
        }

        .post-card[data-category="siem"] .post-header {
            background: linear-gradient(90deg, var(--accent-cyan), rgba(0, 217, 255, 0.4));
        }

        .post-card[data-category="forensics"] .post-header {
            background: linear-gradient(90deg, var(--accent-orange), rgba(249, 115, 22, 0.4));
        }

        .post-card[data-category="compliance"] .post-header {
            background: linear-gradient(90deg, var(--accent-emerald), rgba(16, 185, 129, 0.4));
        }

        .post-card[data-category="web-security"] .post-header {
            background: linear-gradient(90deg, #f59e0b, rgba(245, 158, 11, 0.4));
        }

        .post-card[data-category="threat-modeling"] .post-header {
            background: linear-gradient(90deg, #8b5cf6, rgba(139, 92, 246, 0.4));
        }

        .post-content {
            padding: 24px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .post-meta {
            display: flex;
            gap: 16px;
            margin-bottom: 12px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .post-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .post-card h3 {
            margin: 0 0 12px 0;
            line-height: 1.4;
        }

        .post-card p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 16px;
            flex-grow: 1;
        }

        .post-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: auto;
        }

        .post-tag {
            font-family: "Monaco", "Courier New", monospace;
            font-size: 11px;
            letter-spacing: 0.5px;
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            padding: 3px 8px;
            border-radius: 12px;
            background: transparent;
        }

        .post-link {
            display: inline-block;
            margin-top: 16px;
            padding: 8px 16px;
            background: var(--accent-cyan);
            color: var(--bg-primary);
            border-radius: 4px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: var(--transition);
        }

        .post-link:hover {
            opacity: 0.9;
        }

        .year-separator {
            margin-top: 60px;
            padding-top: 40px;
            border-top: 1px solid rgba(0, 217, 255, 0.1);
        }

        .year-separator h2 {
            margin-top: 0;
            color: var(--text-secondary);
            font-size: 1.3em;
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            border-top: 1px solid rgba(0, 217, 255, 0.1);
            color: var(--text-secondary);
            font-size: 13px;
        }

        footer a {
            color: var(--accent-cyan);
            text-decoration: none;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.2em; }
            .posts-grid { grid-template-columns: 1fr; }
            .filter-buttons { justify-content: flex-start; }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="/">← Back to Portfolio</a>
            <a href="#posts">Articles</a>
        </nav>
    </header>

    <div class="hero">
        <div class="container">
            <h1>Technical Blog</h1>
            <p class="hero-subtitle">Deep dives into cybersecurity labs, incident response, compliance automation, and threat intelligence.</p>
        </div>
    </div>

    <section class="blog-section">
        <div class="container">
            <h2 id="posts">Latest Articles</h2>
            
            <div class="filter-buttons">
                <button class="filter-btn active" onclick="filterPosts('all')">All</button>
                <button class="filter-btn" onclick="filterPosts('siem')">SIEM</button>
                <button class="filter-btn" onclick="filterPosts('forensics')">Forensics</button>
                <button class="filter-btn" onclick="filterPosts('compliance')">Compliance</button>
                <button class="filter-btn" onclick="filterPosts('web-security')">Web Security</button>
                <button class="filter-btn" onclick="filterPosts('threat-modeling')">Threat Modeling</button>
                <button class="filter-btn" onclick="filterPosts('ml')">ML/AI Security</button>
            </div>

            <div class="posts-grid">
                <!-- Posts will be generated here -->
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>© 2026 Emmanuel Kibet Korir | <a href="https://github.com/Korir555">GitHub</a> | <a href="https://linkedin.com/in/emmanuel-korir-a98b32229/">LinkedIn</a></p>
        </div>
    </footer>

    <script>
        const posts = [
            {
                id: "wazuh-siem",
                title: "Wazuh SIEM: Enterprise Threat Detection Setup & Alert Tuning",
                category: "siem",
                date: "Oct 14, 2026",
                readTime: "12 min",
                description: "Real-world Wazuh deployment covering log ingestion from 100+ sources, custom detection rules, MITRE ATT&CK mapping, and alert tuning for SOC operations.",
                tags: ["SIEM", "Wazuh", "Threat Detection", "Log Analysis"],
                link: "/blog/2026/wazuh-siem-setup/"
            },
            {
                id: "incident-response",
                title: "Multi-Stage Incident Response: SOC Training Through Simulation",
                category: "siem",
                date: "Oct 13, 2026",
                readTime: "10 min",
                description: "Building interactive incident response training with multi-stage APT scenarios, decision trees, and playbook validation for SOC analyst development.",
                tags: ["Incident Response", "SOC", "MITRE ATT&CK", "Training"],
                link: "/blog/2026/incident-response-simulation/"
            },
            {
                id: "compliance-banking",
                title: "Compliance Automation for Banking: GDPR, HIPAA, PCI-DSS",
                category: "compliance",
                date: "Oct 12, 2026",
                readTime: "14 min",
                description: "Multi-framework compliance dashboard for banking operations. Automated control validation, evidence collection, and regulatory reporting for Equity Bank.",
                tags: ["Compliance", "GRC", "GDPR", "HIPAA", "PCI-DSS"],
                link: "/blog/2026/compliance-automation/"
            },
            {
                id: "grc-framework",
                title: "Enterprise Risk Quantification: GRC Framework Architecture",
                category: "compliance",
                date: "Oct 11, 2026",
                readTime: "11 min",
                description: "Enterprise risk assessment framework with vulnerability correlation, control mapping, and executive dashboards for board-level risk reporting.",
                tags: ["GRC", "Risk Assessment", "Vulnerability Management"],
                link: "/blog/2026/grc-risk-framework/"
            },
            {
                id: "phishing-ml",
                title: "ML-Powered Phishing Detection: Ensemble Models in Production",
                category: "ml",
                date: "Oct 10, 2026",
                readTime: "13 min",
                description: "Building ensemble ML models (Random Forest + SVM + Neural Network) for email phishing detection. 96% accuracy with NLP and URL reputation scoring.",
                tags: ["Machine Learning", "Email Security", "NLP", "Threat Prevention"],
                link: "/blog/2026/phishing-ml-detection/"
            },
            {
                id: "forensics-linux",
                title: "Digital Forensics on Linux: Memory & Disk Analysis with Kenya's Cybercrime Act",
                category: "forensics",
                date: "Oct 9, 2026",
                readTime: "15 min",
                description: "Linux memory and disk forensics using Volatility and Sleuthkit. Chain of custody, timeline reconstruction, and law enforcement compliance.",
                tags: ["Forensics", "Linux", "Volatility", "Digital Investigation"],
                link: "/blog/2026/linux-forensics/"
            },
            {
                id: "owasp-testing",
                title: "Web App Security Testing: OWASP Top 10 Automation & Manual Verification",
                category: "web-security",
                date: "Oct 8, 2026",
                readTime: "12 min",
                description: "Automated OWASP Top 10 vulnerability scanning with manual verification. SQL injection, XSS, CSRF, and authentication bypass testing methodology.",
                tags: ["Web Security", "OWASP", "Penetration Testing", "Vulnerability Assessment"],
                link: "/blog/2026/owasp-web-testing/"
            },
            {
                id: "threat-modeling",
                title: "Threat Modeling with STRIDE & PASTA: Security by Design",
                category: "threat-modeling",
                date: "Oct 7, 2026",
                readTime: "10 min",
                description: "Systematic threat modeling with STRIDE methodology, data flow diagrams, risk matrices, and compliance framework alignment.",
                tags: ["Threat Modeling", "STRIDE", "Architecture Review", "Security Design"],
                link: "/blog/2026/threat-modeling/"
            }
        ];

        function renderPosts(category = 'all') {
            const grid = document.querySelector('.posts-grid');
            const filtered = category === 'all' ? posts : posts.filter(p => p.category === category);
            
            grid.innerHTML = filtered.map(post => `
                <div class="post-card" data-category="${post.category}">
                    <div class="post-header"></div>
                    <div class="post-content">
                        <div class="post-meta">
                            <span>📅 ${post.date}</span>
                            <span>⏱ ${post.readTime}</span>
                        </div>
                        <h3>${post.title}</h3>
                        <p>${post.description}</p>
                        <div class="post-tags">
                            ${post.tags.map(tag => `<span class="post-tag">${tag}</span>`).join('')}
                        </div>
                        <a href="${post.link}" class="post-link">Read Article →</a>
                    </div>
                </div>
            `).join('');
        }

        function filterPosts(category) {
            // Update button states
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // Render filtered posts
            renderPosts(category);
        }

        // Initial render
        renderPosts();
    </script>
</body>
</html>
